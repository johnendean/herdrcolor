name: CI

# Pull requests are what this exists for: main is protected on the `build` job
# below, so nothing reaches main without one of these going green. Pushes to
# main are still built, to catch a merge broken by its own merge commit rather
# than by either parent.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to a branch makes the first run pointless. Main is exempt: its
# history is what the badge and the protection rule are about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken combination should not hide the state of the other three.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # pytest is the only dependency, and only for the tests.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - run: python -m pytest -q

  # The shipped path runs against a bare system python3 with PYTHONPATH at the
  # checkout -- no venv, no pip, no network at install time, because Herdr runs
  # `bin/herdrcolor` straight from its hooks. The test job cannot prove that:
  # it has just pip-installed the package. This imports every module with
  # nothing installed at all.
  no-dependencies:
    name: no third-party dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import every module with nothing installed
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import importlib
          import pathlib

          # Dunder modules are skipped rather than overlooked: importing
          # herdrcolor.__main__ runs sys.exit(main()), which would print usage
          # and exit 2.
          modules = sorted(
              f"herdrcolor.{path.stem}"
              for path in pathlib.Path("src/herdrcolor").glob("*.py")
              if not path.stem.startswith("__")
          )
          for name in modules:
              importlib.import_module(name)
              print(f"ok  {name}")
          print(f"\n{len(modules)} modules, no third-party imports")
          PY

  # `snippet` prints config for a person to paste into config.toml, and it is
  # generated from the palette. A palette change that produced invalid TOML, or
  # that left a colour with no slot to live in, would only show up when someone
  # pasted it and reloaded Herdr. Cheaper to catch here.
  snippet:
    name: snippet is valid config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse the generated snippet
        env:
          PYTHONPATH: src
        run: |
          ./bin/herdrcolor snippet > snippet.toml
          python - <<'PY'
          import pathlib
          import tomllib

          from herdrcolor import palette

          text = pathlib.Path("snippet.toml").read_text()
          config = tomllib.loads(text)  # raises if the output is not valid TOML

          # Deliberately not reusing the plugin's own config reader: this job
          # checks what a person would paste, so it looks for the tokens the way
          # Herdr does -- by finding them in the parsed document.
          def tokens(node):
              if isinstance(node, dict):
                  if isinstance(node.get("token"), str):
                      yield node["token"]
                  for value in node.values():
                      yield from tokens(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from tokens(value)
              elif isinstance(node, str):
                  yield node

          found = set(tokens(config))
          print("tokens in the snippet:", " ".join(sorted(found)))

          missing = [
              f"${palette.slot_token(colour.slot)}"
              for colour in palette.PALETTE
              if f"${palette.slot_token(colour.slot)}" not in found
          ]
          assert not missing, f"palette colours with no slot in the config: {missing}"
          print(f"\nall {len(palette.PALETTE)} palette colours have a slot")
          PY

  # The one check main is protected on. Requiring the matrix jobs directly
  # would pin the protection rule to their generated names, so adding a python
  # version or dropping a runner would silently stop being required. This gate
  # is a stable name that fails whenever anything it needs does.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [test, no-dependencies, snippet]
    if: always()
    steps:
      - name: Check that everything passed
        run: |
          echo "tests:            ${{ needs.test.result }}"
          echo "no-dependencies:  ${{ needs.no-dependencies.result }}"
          echo "snippet:          ${{ needs.snippet.result }}"
          [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.no-dependencies.result }}" = "success" ] \
            && [ "${{ needs.snippet.result }}" = "success" ]
