name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # go.mod pins the exact toolchain, the same one release builds need.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

      # The binary the manifest runs, at the path it runs it from, built and
      # started on each runner. Whether Herdr's launcher resolves the
      # extensionless argv to herdrcolor.exe was checked by hand against Herdr
      # 0.9.5; CI has no Herdr to ask.
      - run: go build -o bin/herdrcolor${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/herdrcolor
      - run: ./bin/herdrcolor version
        shell: bash

  # Every release target must build, and builds must be reproducible: install
  # checks each download against sums committed before CI builds anything. This
  # builds everything twice and compares. It does not compare against
  # checksums.txt, which describes the release the manifest names, not the
  # source on this branch.
  release-targets:
    name: release targets build reproducibly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/release
      - run: rm -rf dist && go run ./tools/release -check
      - run: git checkout -- checksums.txt

  # The install scripts, against a locally built "release": a good binary must
  # install, and a tampered one must be refused.
  fetch:
    name: fetch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/release

      - name: fetch.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HERDRCOLOR_RELEASE_URL="file://$PWD/dist"
          sh ./bin/fetch.sh
          ./bin/herdrcolor version
          rm bin/herdrcolor
          mkdir bad && for f in dist/*; do cp "$f" bad/ && echo x >> "bad/$(basename "$f")"; done
          if HERDRCOLOR_RELEASE_URL="file://$PWD/bad" sh ./bin/fetch.sh; then
            echo "a tampered binary was installed"; exit 1
          fi
          test ! -e bin/herdrcolor

      - name: fetch.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HERDRCOLOR_RELEASE_URL = "file:///$($PWD.Path -replace '\\','/')/dist"
          powershell -NoProfile -ExecutionPolicy Bypass -File bin/fetch.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./bin/herdrcolor.exe version
          Remove-Item bin/herdrcolor.exe
          New-Item -ItemType Directory bad | Out-Null
          Get-ChildItem dist | ForEach-Object {
            Copy-Item $_.FullName bad/
            Add-Content -Path "bad/$($_.Name)" -Value 'x'
          }
          $env:HERDRCOLOR_RELEASE_URL = "file:///$($PWD.Path -replace '\\','/')/bad"
          powershell -NoProfile -ExecutionPolicy Bypass -File bin/fetch.ps1
          if ($LASTEXITCODE -eq 0) { Write-Error 'a tampered binary was installed'; exit 1 }
          if (Test-Path bin/herdrcolor.exe) { Write-Error 'tampered binary left behind'; exit 1 }
          exit 0

  # The one check main is protected on. Requiring the matrix jobs directly
  # would pin the protection rule to their generated names, so adding a runner
  # would silently stop being required. This gate is a stable name that fails
  # whenever anything it needs does.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [test, release-targets, fetch]
    if: always()
    steps:
      - name: Check that everything passed
        run: |
          echo "test:             ${{ needs.test.result }}"
          echo "release-targets:  ${{ needs.release-targets.result }}"
          echo "fetch:            ${{ needs.fetch.result }}"
          [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.release-targets.result }}" = "success" ] \
            && [ "${{ needs.fetch.result }}" = "success" ]
